name: Control Total iOS native build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-native.yml'
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare Firebase configuration for simulator compilation
        env:
          FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
        run: |
          if [ -n "$FIREBASE_IOS_PLIST_BASE64" ]; then
            printf '%s' "$FIREBASE_IOS_PLIST_BASE64" | base64 --decode > ios/ControlTotal/GoogleService-Info.plist
            plutil -lint ios/ControlTotal/GoogleService-Info.plist
          elif [ ! -f ios/ControlTotal/GoogleService-Info.plist ]; then
            echo "::warning::Firebase iOS config missing. Generating a placeholder ONLY for simulator compile validation. Authentication and synchronization will NOT work with this placeholder."
            cat > ios/ControlTotal/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>API_KEY</key><string>placeholder-not-functional</string>
          <key>GCM_SENDER_ID</key><string>000000000000</string>
          <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          <key>PROJECT_ID</key><string>placeholder</string>
          <key>BUNDLE_ID</key><string>cl.controltotal.finanzas.ios</string>
          </dict></plist>
          PLIST
          fi
      - name: Verify Firebase config for device distribution
        if: ${{ env.FIREBASE_IOS_PLIST_BASE64 != '' }}
        env:
          FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
        run: |
          /usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' ios/ControlTotal/GoogleService-Info.plist >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' ios/ControlTotal/GoogleService-Info.plist >/dev/null
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build iOS simulator app (not an installable IPA)
        run: |
          set -o pipefail
          xcodebuild -project ios/ControlTotal.xcodeproj -scheme ControlTotal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > /tmp/controltotal-ios-build.log 2>&1 || {
            echo "::group::Swift compiler errors and surrounding context"
            grep -n -E -C 5 '(^|[[:space:]])error:|SwiftCompile|BUILD FAILED' /tmp/controltotal-ios-build.log | tail -n 250 || true
            echo "::endgroup::"
            echo "::error::iOS simulator compilation failed; see concise errors above and attached full log"
            exit 1
          }
          echo "iOS simulator compilation succeeded"
      - name: Upload full compiler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: control-total-ios-build-log
          path: /tmp/controltotal-ios-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Check IPA signing prerequisites
        id: signing
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ] && [ -n "$CERTIFICATE" ] && [ -n "$CERTIFICATE_PASSWORD" ] && [ -n "$PROFILE" ] && [ -n "$TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Simulator build passed. A signed iPhone IPA requires Firebase iOS config, Apple certificate, provisioning profile and team ID in repository secrets."
          fi
      - name: Install iOS signing credentials
        if: steps.signing.outputs.ready == 'true'
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/signing.mobileprovision"
          security create-keychain -p "$RUNNER_TEMP" ios-build.keychain
          security set-keychain-settings -lut 21600 ios-build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" ios-build.keychain
          security import "$RUNNER_TEMP/signing.p12" -k ios-build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" ios-build.keychain
          security list-keychains -d user -s ios-build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/signing.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/ControlTotal.mobileprovision"
      - name: Archive native iOS app
        if: steps.signing.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -project ios/ControlTotal.xcodeproj -scheme ControlTotal -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ControlTotal.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" archive
      - name: Export signed IPA
        if: steps.signing.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ControlTotal.xcarchive" -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload signed IPA
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ControlTotal-iPhone-IPA
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain ios-build.keychain 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.mobileprovision"
