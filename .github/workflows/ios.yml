name: Control Total iOS build
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare Firebase config for simulator build
        env:
          FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
        run: |
          if [ -n "$FIREBASE_IOS_PLIST_BASE64" ]; then
            printf '%s' "$FIREBASE_IOS_PLIST_BASE64" | base64 --decode > ios/ControlTotal/GoogleService-Info.plist
            plutil -lint ios/ControlTotal/GoogleService-Info.plist
          elif [ ! -f ios/ControlTotal/GoogleService-Info.plist ]; then
            echo "::warning::Using placeholder Firebase config for simulator compilation only. Authentication and sync require the real iOS Firebase configuration."
            cat > ios/ControlTotal/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>API_KEY</key><string>placeholder-not-functional</string>
          <key>GCM_SENDER_ID</key><string>000000000000</string>
          <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          <key>PROJECT_ID</key><string>placeholder</string>
          <key>BUNDLE_ID</key><string>cl.controltotal.finanzas.ios</string>
          </dict></plist>
          PLIST
          fi
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Compile iOS simulator app
        run: |
          xcodebuild -project ios/ControlTotal.xcodeproj -scheme ControlTotal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
