<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1025"><meta name="apple-mobile-web-app-capable" content="yes"><title>Control Total</title><link rel="manifest" href="/manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;background:#0c1025;color:#fff;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:600px;margin:auto;padding:22px 16px 70px}h1{color:#c4b5fd;font-size:25px}h2{font-size:18px}section{background:#27224e;border-radius:18px;padding:17px;margin:14px 0}input,select,button{width:100%;padding:13px;margin:6px 0;border-radius:11px;font-size:16px}input,select{background:#131936;color:white;border:1px solid #69638e}button{background:#7965dd;border:0;color:white;font-weight:700}button:disabled{opacity:.5}.secondary{background:#383359}.danger{background:#67364b}.muted{color:#c4b5fd}.error{color:#ff9d9d;white-space:pre-wrap}.good{color:#75f0bf}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.entry{border-top:1px solid #554d77;padding:12px 0}.entry button{width:auto;padding:7px 10px;font-size:13px;float:right}small{color:#c4b5fd}#status{min-height:24px;word-break:break-word}</style></head><body><main><h1>CONTROL TOTAL</h1><p class="muted">Finanzas familiares · iPhone</p><p id="status" role="status"></p><div id="app">Cargando...</div></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="/__/firebase/init.js"></script><script>
const $=id=>document.getElementById(id),app=$('app'),status=$('status');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);const currentMonth=()=>new Date().toISOString().slice(0,7);let db,auth,uid,hid=null,unsubProfile=null,unsubEntries=null,entries=[],month=currentMonth();function notice(msg,bad=false){status.textContent=msg;status.className=bad?'error':'good'}function fail(e){notice(e?.message||String(e),true)}function clean(){unsubProfile?.();unsubEntries?.();unsubProfile=unsubEntries=null;entries=[];hid=null}function renderAuth(){app.innerHTML='<section><h2>Ingresar o crear cuenta</h2><form id="login"><input type="email" id="email" placeholder="Correo" required autocomplete="email"><input type="password" id="pass" placeholder="Contraseña (mínimo 6 caracteres)" minlength="6" required autocomplete="current-password"><button>Iniciar sesión</button><button type="button" class="secondary" id="signup">Crear cuenta</button></form></section>';const credentials=()=>[$('email').value.trim(),$('pass').value];$('login').onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(...credentials())}catch(err){fail(err)}};$('signup').onclick=async()=>{try{await auth.createUserWithEmailAndPassword(...credentials())}catch(err){fail(err)}}}function renderHome(){app.innerHTML='<section><h2>Tu hogar familiar</h2><p>Si tu pareja ya creó el hogar, ingresa su código. No crees otro hogar.</p><button id="create">Crear hogar</button><input id="invite" placeholder="Código del hogar de tu pareja" autocomplete="off"><button id="join">Unirme al hogar</button></section><button class="secondary" id="logout">Cerrar sesión</button>';$('logout').onclick=()=>auth.signOut();$('create').onclick=async()=>{try{const id=crypto.randomUUID();await db.collection('households').doc(id).set({ownerUid:uid,members:{[uid]:true}});await db.collection('profiles').doc(uid).set({householdId:id});notice('Hogar creado')}catch(e){fail(e)}};$('join').onclick=async()=>{const id=$('invite').value.trim();if(!id)return;try{const ref=db.collection('households').doc(id);await db.runTransaction(async t=>{const snap=await t.get(ref);if(!snap.exists)throw Error('No existe ese hogar');t.update(ref,'members.'+uid,true)});await db.collection('profiles').doc(uid).set({householdId:id});notice('Te uniste al hogar')}catch(e){fail(e)}}}function renderEntries(){const visible=entries.filter(x=>x.month===month).sort((a,b)=>b.createdAt-a.createdAt),sum=t=>visible.filter(x=>x.type===t).reduce((a,x)=>a+x.amount,0);app.innerHTML='<section><small>Cuenta: '+esc(auth.currentUser.email)+'</small><p>Código del hogar (compártelo solo con tu pareja):</p><p style="overflow-wrap:anywhere">'+esc(hid)+'</p></section><section><div class="row"><button id="prev">‹ Anterior</button><strong>'+esc(month)+'</strong><button id="next">Siguiente ›</button></div><h2>Ingresos familiares</h2><h1 class="good">'+money(sum('Ingreso'))+'</h1><p>Gastos: '+money(sum('Gasto'))+'</p><p>Deudas: '+money(sum('Deuda'))+'</p><h2>Disponible: '+money(sum('Ingreso')-sum('Gasto'))+'</h2></section><section><h2>Nuevo movimiento</h2><form id="add"><input id="title" maxlength="160" placeholder="Descripción" required><input id="amount" type="number" min="1" step="1" placeholder="Monto en pesos" required><select id="type"><option>Ingreso</option><option>Gasto</option><option>Deuda</option></select><select id="owner"><option>Familiar</option><option>Yo</option><option>Esposa</option></select><button>Guardar movimiento</button></form></section><section><h2>Historial del mes</h2><div id="history">'+(visible.length?visible.map(x=>'<div class="entry"><button class="danger" data-id="'+esc(x.id)+'">Eliminar</button><b>'+esc(x.title)+'</b><p class="muted">'+esc(x.type)+' · '+esc(x.owner)+' · '+money(x.amount)+'</p></div>').join(''):'Sin movimientos este mes')+'</div></section><button class="secondary" id="logout">Cerrar sesión</button>';$('logout').onclick=()=>auth.signOut();$('prev').onclick=()=>{let d=new Date(month+'-01T12:00:00');d.setMonth(d.getMonth()-1);month=d.toISOString().slice(0,7);renderEntries()};$('next').disabled=month>=currentMonth();$('next').onclick=()=>{let d=new Date(month+'-01T12:00:00');d.setMonth(d.getMonth()+1);month=d.toISOString().slice(0,7);renderEntries()};$('add').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const amount=Number($('amount').value);if(!Number.isSafeInteger(amount)||amount<=0)throw Error('Monto inválido');await db.collection('households').doc(hid).collection('entries').add({title:$('title').value.trim(),amount,type:$('type').value,owner:$('owner').value,month,createdBy:uid,createdAt:Date.now()});notice('Movimiento guardado')}catch(e){fail(e)}finally{btn.disabled=false}};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar este movimiento?'))return;try{await db.collection('households').doc(hid).collection('entries').doc(b.dataset.id).delete()}catch(e){fail(e)}})}try{auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(user=>{clean();notice('');uid=user?.uid||null;if(!user){renderAuth();return}app.textContent='Buscando hogar...';unsubProfile=db.collection('profiles').doc(uid).onSnapshot(s=>{const id=s.data()?.householdId;if(!id){unsubEntries?.();unsubEntries=null;hid=null;renderHome();return}if(hid===id)return;hid=id;unsubEntries?.();app.textContent='Cargando movimientos...';unsubEntries=db.collection('households').doc(id).collection('entries').onSnapshot(s=>{entries=s.docs.map(d=>({id:d.id,...d.data()}));renderEntries()},fail)},fail)})}catch(e){app.textContent='No se pudo iniciar Firebase. Publica esta aplicación mediante Firebase Hosting y registra una aplicación web en el proyecto.';fail(e)}if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
